      <style>

        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
        :root {

          --ink: #1d1d1f; --ink-2: #3a3a3e; --dim: #6e6e73; --mute: #747478;
          --accent: #0071e3; --accent-ink: #0062c4; --accent-soft: #eaf2fe; --bug: #d0342c; --ok: #1d8a54;

        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
        .win { position: absolute; background: var(--canvas); border: 1px solid var(--line-2); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
        .win-bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 22px; padding: 0 24px; background: var(--surface-2); border-bottom: 1px solid var(--line); }

        .url { flex: 1; height: 40px; border-radius: 999px; background: var(--canvas); border: 1px solid var(--line); position: relative; overflow: hidden; font-size: 21px; color: var(--dim); }
        .url span { position: absolute; left: 22px; top: 7px; white-space: nowrap; }
        .url b { color: var(--ink-2); font-weight: 500; }
        .tb-icons { display: flex; align-items: center; gap: 18px; width: 120px; justify-content: flex-end; }
        .puzzle { width: 30px; height: 30px; display: block; }
        .tb-bug { width: 38px; height: 38px; border-radius: 9px; display: block; }
        .win-body { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; overflow: hidden; }
        .cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; opacity: 0; }
        .cursor svg { width: 40px; height: 40px; display: block; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.25)); }
        .click-ring { position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
        #s3-wrap { position: absolute; inset: 0; }
        /* transparent window: the install scene shows through while the website fades in */
        #s3-win { background: transparent; }
        #s3-site { position: absolute; inset: 0; background: #f7f8fa; opacity: 0; }
        #s3-page { position: absolute; inset: 0; }
        #s3-nav { position: absolute; left: 0; right: 0; top: 0; height: 66px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 40px; font-size: 25px; font-weight: 600; color: var(--ink); }
        #s3-nav .lg { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #f0624d, #e83e6c); }
        #s3-nav .lk { font-size: 21px; font-weight: 500; color: var(--dim); margin-left: 22px; }
        #s3-h1 { position: absolute; left: 80px; top: 92px; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
        .s3-card { position: absolute; background: #fff; border: 1px solid var(--line-2); border-radius: 20px; }
        .s3-fl { position: absolute; left: 32px; font-size: 20px; font-weight: 500; color: var(--ink-2); }
        .s3-fi { position: absolute; left: 32px; right: 32px; height: 54px; border: 1px solid var(--line-2); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; font-size: 22px; color: var(--ink); }
        .s3-pay { position: absolute; left: 32px; right: 32px; height: 64px; border-radius: 12px; background: #cf5c0c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; }
        .s3-err { position: absolute; left: 32px; right: 32px; height: 58px; border-radius: 12px; background: #fdf0ef; border: 1px solid #f3c9c5; color: #b3261e; display: flex; align-items: center; padding: 0 18px; font-size: 22px; }
        .s3-sm { position: absolute; left: 32px; font-size: 17px; color: var(--mute); }
        .s3-img { position: absolute; left: 28px; right: 28px; top: 28px; height: 170px; border-radius: 14px; background: linear-gradient(120deg, #2aa3e8, #7a5af0 55%, #e8559a); }
        .s3-row { position: absolute; left: 28px; right: 28px; display: flex; justify-content: space-between; font-size: 21px; color: var(--ink-2); }
        #s3-capframe { position: absolute; inset: 6px; border: 3px solid var(--accent); border-radius: 14px; opacity: 0; }
        .s3-crop { position: absolute; overflow: hidden; }
        .s3-crop img { position: absolute; display: block; max-width: none; }
        #s3-menu { left: 1110px; top: 8px; width: 540px; height: 530px; border-radius: 16px; box-shadow: var(--shadow); opacity: 0; }
        #s3-menu-hi { position: absolute; left: 1118px; top: 134px; width: 516px; height: 62px; border-radius: 10px; background: rgba(0, 113, 227, 0.28); border: 2px solid rgba(80, 160, 255, 0.9); opacity: 0; }
        #s3-recbar { left: 560px; top: 22px; width: 560px; height: 124px; border-radius: 22px; box-shadow: var(--shadow); opacity: 0; }
        #s3-note {
          position: absolute; left: 610px; top: 698px; height: 52px; padding: 0 20px; border-radius: 10px;
          background: var(--bug); color: #fff; font-size: 24px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; opacity: 0;
        }
        #s3-note .ch { display: none; }
      </style>

      <div id="root" data-composition-id="s3-capture" data-width="1920" data-height="1080">
        <div id="s3-wrap">
          <div class="win" id="s3-win" style="left: 120px; top: 40px; width: 1680px; height: 820px">
            <div class="win-bar">
              <div class="dots"><i></i><i></i><i></i></div>
              <div class="url" data-layout-allow-overlap>
                <span id="s3-url-store"><b>chromewebstore.google.com</b>/detail/pmddndflbglmpliiinfhhecmfkmfffkj</span>
                <span id="s3-url-site" style="opacity: 0"><b>lumenstays.com</b>/checkout</span>
              </div>
              <div class="tb-icons">
                <svg class="puzzle" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4.5a1.8 1.8 0 0 1 3.6 0V6H16a1 1 0 0 1 1 1v3.4h1.5a1.8 1.8 0 0 1 0 3.6H17V18a1 1 0 0 1-1 1h-3.4v-1.5a1.8 1.8 0 0 0-3.6 0V19H6a1 1 0 0 1-1-1v-3.4h1.5a1.8 1.8 0 0 0 0-3.6H5V7a1 1 0 0 1 1-1h3z" /></svg>
                <img class="tb-bug" src="assets/logo.png" alt="" />
              </div>
            </div>
            <div class="win-body">
              <div id="s3-site">
                <div id="s3-page">
                  <div id="s3-nav"><div class="lg"></div>Lumen Stays<span class="lk">Explore</span><span class="lk">Trips</span><span class="lk">Help</span></div>
                  <div id="s3-h1">Confirm and pay</div>
                  <div class="s3-card" style="left: 80px; top: 170px; width: 860px; height: 560px">
                    <div class="s3-fl" style="top: 30px">Name on card</div>
                    <div class="s3-fi" style="top: 62px">Maya Fernandes</div>
                    <div class="s3-fl" style="top: 140px">Card number</div>
                    <div class="s3-fi" style="top: 172px">4000 0000 0000 0002</div>
                    <div class="s3-fl" style="top: 250px">Expiry · CVC</div>
                    <div class="s3-fi" style="top: 282px">09 / 28 &nbsp;·&nbsp; •••</div>
                    <div class="s3-pay" style="top: 366px">Confirm and pay · €842.40</div>
                    <div class="s3-err" style="top: 450px">Your card was declined. Try a different payment method.</div>
                    <div class="s3-sm" style="top: 524px">By confirming you agree to the house rules.</div>
                  </div>
                  <div class="s3-card" style="left: 990px; top: 170px; width: 610px; height: 560px">
                    <div class="s3-img"></div>
                    <div class="s3-row" style="top: 226px; font-size: 26px; font-weight: 600; color: var(--ink)">Casa Alfama · River-view loft</div>
                    <div class="s3-row" style="top: 266px; color: var(--mute); font-size: 20px">Lisbon, Portugal · 2 guests</div>
                    <div class="s3-row" style="top: 330px"><span>€186 × 4 nights</span><span>€744.00</span></div>
                    <div class="s3-row" style="top: 372px"><span>Cleaning fee</span><span>€45.00</span></div>
                    <div class="s3-row" style="top: 414px"><span>Taxes</span><span>€53.40</span></div>
                    <div class="s3-row" style="top: 470px; font-weight: 600; color: var(--ink); font-size: 24px"><span>Total (EUR)</span><span>€842.40</span></div>
                  </div>
                  <svg style="position: absolute; left: 0; top: 0" width="1680" height="756" viewBox="0 0 1680 756">
                    <ellipse id="s3-circle" cx="510" cy="649" rx="455" ry="62" fill="none" stroke="#d0342c" stroke-width="6" stroke-linecap="round" />
                  </svg>
                  <div id="s3-note"><span id="s3-note-text">Valid test card is declined</span></div>
                </div>
                <div id="s3-capframe"></div>
                <div class="s3-crop" id="s3-menu"><img data-layout-allow-overflow src="assets/screens/capture-menu.webp" alt="" style="left: -1293px; top: -30px; width: 1964px" /></div>
                <div id="s3-menu-hi"></div>
                <div class="s3-crop" id="s3-recbar"><img data-layout-allow-overflow src="assets/screens/recording-bar.webp" alt="" style="left: -257px; top: -39px; width: 1493px" /></div>
              </div>
            </div>
          </div>
          <div class="click-ring" id="s3-click"></div>
          <div class="cursor" id="s3-cursor"><svg viewBox="0 0 24 24"><path d="M4 2.5l15.5 10.2-6.9 1.3 4 7.4-2.9 1.5-4-7.4-5.2 4.6z" fill="#1d1d1f" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" /></svg></div>
        </div>
      </div>

      <script>
        (function () {
          // cursor helpers — coordinates are frame pixels of the arrow tip
          function cursorTo(tl, cur, x, y, t, d) { tl.to(cur, { x: x - 7, y: y - 4, duration: d, ease: "power2.inOut" }, t); }
          function click(tl, cur, ring, x, y, t) {
            tl.to(cur, { scale: 0.86, duration: 0.08, ease: "power1.in", transformOrigin: "4px 3px" }, t);
            tl.to(cur, { scale: 1, duration: 0.14, ease: "power1.out" }, t + 0.08);
            tl.fromTo(ring, { x: x - 28, y: y - 28, scale: 0.4, opacity: 0.8 }, { scale: 1.25, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
          }
          // Scene window 12.2–20.9 s of the film. A(t) converts film time to scene time.
          const A = (t) => +(t - 12.2).toFixed(3);
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out", IO = "sine.inOut";
          const cur = "#s3-cursor", ring = "#s3-click";
          tl.set(cur, { x: 1443, y: 516, opacity: 0 }, 0);
          // the website replaces the store page inside the same window
          tl.to("#s3-site", { opacity: 1, duration: 0.5, ease: IO }, 0);
          tl.to("#s3-url-store", { opacity: 0, duration: 0.3 }, 0);
          tl.to("#s3-url-site", { opacity: 1, duration: 0.3 }, 0.15);
          // click Bugmark in the toolbar
          tl.to(cur, { opacity: 1, duration: 0.25 }, A(12.9));
          cursorTo(tl, cur, 1756, 72, A(12.9), 0.95);
          click(tl, cur, ring, 1756, 72, A(13.95));
          tl.fromTo("#s3-menu", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, A(14.1));
          cursorTo(tl, cur, 1390, 269, A(14.2), 0.45);
          tl.fromTo("#s3-menu-hi", { opacity: 0 }, { opacity: 1, duration: 0.15 }, A(14.55));
          click(tl, cur, ring, 1390, 269, A(14.75));
          tl.to(["#s3-menu", "#s3-menu-hi"], { opacity: 0, duration: 0.25, ease: "power1.in" }, A(14.95));
          tl.to(cur, { opacity: 0, duration: 0.25 }, A(14.95));
          // screenshot taken: a calm blue frame, no flash
          tl.fromTo("#s3-capframe", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IO }, A(15.05));
          tl.to("#s3-capframe", { opacity: 0, duration: 0.4, ease: IO }, A(15.45));
          tl.fromTo("#s3-page", { scale: 1 }, { scale: 0.985, duration: 0.2, ease: IO, transformOrigin: "50% 50%" }, A(15.05));
          tl.to("#s3-page", { scale: 1, duration: 0.35, ease: IO }, A(15.25));
          // circle the problem + a typed note
          const C = 2 * Math.PI * Math.sqrt((455 * 455 + 62 * 62) / 2);
          tl.set("#s3-circle", { strokeDasharray: C, strokeDashoffset: C, opacity: 0 }, 0);
          tl.set("#s3-circle", { opacity: 1 }, A(15.35));
          tl.to("#s3-circle", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, A(15.35));
          tl.fromTo("#s3-note", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: E }, A(16.0));
          const note = document.getElementById("s3-note-text");
          const text = note.textContent;
          note.textContent = "";
          [...text].forEach((ch, i) => {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = ch;
            note.appendChild(s);
            tl.set(s, { display: "inline" }, A(16.1) + i * 0.03);
          });
          // or record your screen
          tl.fromTo("#s3-recbar", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, A(16.55));
          tl.fromTo("#s3-page", { scale: 1 }, { scale: 1.035, duration: 3.6, ease: "none", transformOrigin: "35% 85%", immediateRender: false }, A(16.8));
          tl.to("#s3-wrap", { opacity: 0, duration: 0.5, ease: IO }, A(20.4));
          window.__timelines["s3-capture"] = tl;
        })();
      </script>
    </template>
  </body>
