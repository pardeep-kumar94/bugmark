<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>S7 · outro</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/BricolageGrotesque-latin-600-800.woff2") format("woff2"); font-weight: 600 800; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
        :root {
          --canvas: #ffffff; --surface: #fbfbfd; --surface-2: #f5f5f7; --line: #eaeaee; --line-2: #dedee3;
          --ink: #1d1d1f; --ink-2: #3a3a3e; --dim: #6e6e73; --mute: #747478;
          --accent: #0071e3; --accent-ink: #0062c4; --accent-soft: #eaf2fe; --bug: #d0342c; --ok: #1d8a54;
          --display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
          --sans: "Geist", system-ui, sans-serif;
          --shadow: 0 40px 90px -36px rgba(15, 20, 40, 0.32), 0 2px 8px rgba(20, 25, 40, 0.05);
        }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
        #s7-wrap { position: absolute; inset: 0; }
        #s7-logo { position: absolute; left: 894px; top: 196px; width: 132px; height: 132px; border-radius: 30px; display: block; }
        #s7-word { position: absolute; left: 0; right: 0; top: 344px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 150px; letter-spacing: -0.045em; color: var(--ink); line-height: 1; }
        #s7-tag { position: absolute; left: 0; right: 0; top: 522px; text-align: center; font-size: 46px; font-weight: 500; color: var(--ink-2); letter-spacing: -0.01em; }
        #s7-price { position: absolute; left: 0; right: 0; top: 606px; text-align: center; font-size: 34px; font-weight: 500; color: var(--dim); }
        #s7-price b { color: var(--ink); font-weight: 600; }
        #s7-cta {
          position: absolute; left: 790px; top: 690px; width: 340px; height: 80px; border-radius: 999px;
          background: var(--accent); color: #fff; font-size: 30px; font-weight: 600; display: flex; align-items: center; justify-content: center;
        }
      </style>

      <div id="root" data-composition-id="s7-outro" data-width="1920" data-height="1080">
        <div id="s7-wrap">
          <img id="s7-logo" src="assets/logo.png" alt="" />
          <div id="s7-word">Bugmark</div>
          <div id="s7-tag">Bug reports anyone can send.</div>
          <div id="s7-price">Free to try · <b>$7.99 one-time</b> · No account</div>
          <div id="s7-cta">Add to Chrome</div>
        </div>
      </div>

      <script>
        (function () {
          // Scene window 50.4–58.0 s of the film. A(t) converts film time to scene time.
          const A = (t) => +(t - 50.4).toFixed(3);
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          tl.fromTo("#s7-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 0);
          tl.fromTo("#s7-logo", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: E }, A(50.6));
          tl.fromTo("#s7-word", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: E }, A(50.8));
          tl.fromTo("#s7-price", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: E }, A(52.2));
          tl.fromTo("#s7-cta", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: E }, A(52.7));
          // the tagline lands after its caption leaves, so the words are never on screen twice
          tl.fromTo("#s7-tag", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: E }, A(53.95));
          window.__timelines["s7-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
