<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bugmark — See Bugmark in one minute</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }
      /* sub-composition slots fill the frame; later scenes sit above earlier ones for the crossfades */
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      #el-s1 { z-index: 1; } #el-s2 { z-index: 2; } #el-s3 { z-index: 3; } #el-s4 { z-index: 4; }
      #el-s5 { z-index: 5; } #el-s6 { z-index: 6; } #el-s7 { z-index: 7; } #el-captions { z-index: 10; }
      /* persistent background: hairline grid + one soft blue glow */
      #grid {
        background-image:
          linear-gradient(to right, rgba(29, 29, 31, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(29, 29, 31, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(110% 80% at 50% 0%, #000 30%, transparent 80%);
        mask-image: radial-gradient(110% 80% at 50% 0%, #000 30%, transparent 80%);
      }
      #glow {
        background: radial-gradient(750px 550px at 50% 8%, rgba(0, 113, 227, 0.12), rgba(0, 113, 227, 0.04) 50%, transparent 72%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="58" data-width="1920" data-height="1080">
      <div id="grid" class="clip" data-track-kind="graphics" data-start="0" data-duration="58" data-track-index="0"></div>
      <div id="glow" class="clip" data-track-kind="graphics" data-start="0" data-duration="58" data-track-index="1"></div>

      <!-- scenes: one sub-composition each; 0.5 s overlaps carry the crossfades -->
      <div id="el-s1" data-track-kind="graphics" data-composition-id="s1-message" data-composition-src="compositions/s1-message.html" data-start="0" data-duration="6.1" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s2" data-track-kind="graphics" data-composition-id="s2-install" data-composition-src="compositions/s2-install.html" data-start="5.6" data-duration="7.1" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="el-s3" data-track-kind="graphics" data-composition-id="s3-capture" data-composition-src="compositions/s3-capture.html" data-start="12.2" data-duration="8.7" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s4" data-track-kind="graphics" data-composition-id="s4-report" data-composition-src="compositions/s4-report.html" data-start="20.4" data-duration="12.7" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="el-s5" data-track-kind="graphics" data-composition-id="s5-send" data-composition-src="compositions/s5-send.html" data-start="32.6" data-duration="9.3" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="el-s6" data-track-kind="graphics" data-composition-id="s6-developer" data-composition-src="compositions/s6-developer.html" data-start="41.4" data-duration="9.5" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="el-s7" data-track-kind="graphics" data-composition-id="s7-outro" data-composition-src="compositions/s7-outro.html" data-start="50.4" data-duration="7.6" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- one caption track: the voiceover verbatim -->
      <div id="el-captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="58" data-track-index="4" data-width="1920" data-height="1080"></div>

      <!-- audio: the voiceover is the only track (music licence unconfirmed; voice-only release) -->
      <audio id="narration" src="assets/voiceover.wav" data-start="0" data-duration="58" data-track-index="20" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
